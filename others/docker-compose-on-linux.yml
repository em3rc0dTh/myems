version: '3.8'
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: '!MyEMS1'
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p!MyEMS1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
        - myems-net

  api:
    build: ../myems-api
    env_file:
      - ../myems-api/.env
    command: gunicorn app:api -b 0.0.0.0:8000 --timeout 600 --workers=4
    volumes:
      - /myems-upload:/var/www/myems-admin/upload
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    networks:
      - myems-net

  aggregation:
    build: ../myems-aggregation
    env_file:
      - ../myems-aggregation/.env
    command: python main.py
    restart: always
    depends_on:
      - api
    networks:
      - myems-net

  cleaning:
    build: ../myems-cleaning
    env_file:
      - ../myems-cleaning/.env
    command: python main.py
    restart: always
    depends_on:
      - api
    networks:
      - myems-net

  modbus_tcp:
    build: ../myems-modbus-tcp
    env_file:
      - ../myems-modbus-tcp/.env
    command: python main.py
    restart: always
    depends_on:
      - api
    networks:
      - myems-net

  mqtt:
    build: ../myems-mqtt
    env_file:
      - ../myems-mqtt/.env
    command: python main.py
    restart: always
    depends_on:
      - api
      - broker
    networks:
      - myems-net

  broker:
    build: ../myems-mqtt-broker
    container_name: myems-mqtt-broker
    env_file:
      - ../myems-mqtt/.env
    environment:
      - MQTT_USER=${MYEMS_MQTT_BROKER_USERNAME}
      - MQTT_PASSWORD=${MYEMS_MQTT_BROKER_PASSWORD}
    volumes:
      - ../myems-mqtt-broker/config:/mosquitto/config
      - ../myems-mqtt-broker/data:/mosquitto/data
      - ../myems-mqtt-broker/log:/mosquitto/log
    ports:
      - "1883:1883"
    restart: always
    networks:
      - myems-net

  normalization:
    build: ../myems-normalization
    env_file:
      - ../myems-normalization/.env
    command: python main.py
    restart: always
    depends_on:
      - api
    networks:
      - myems-net

  admin:
    build: ../myems-admin
    command: nginx -c /etc/nginx/nginx.conf -g "daemon off;"
    healthcheck:
      test: [ "CMD","nginx","-t" ]
    volumes:
      - /myems-upload:/var/www/myems-admin/upload
    restart: always
    ports:
      - "8001:8001"
    depends_on:
    - api
    networks:
      - myems-net

  web:
    build: ../myems-web
    command: nginx -c /etc/nginx/nginx.conf -g "daemon off;"
    healthcheck:
      test: [ "CMD","nginx","-t" ]
    restart: always
    ports:
      - "80:80"
    depends_on:
    - api
    networks:
      - myems-net

  telxius:
    build: ../myems-telxius
    restart: always
    environment:
      - NEXT_PUBLIC_INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
    depends_on:
      - influxdb
    networks:
      - myems-net

  influxdb:
    image: influxdb:latest
    container_name: myems-influxdb
    restart: always
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    ports:
      - "8086:8086"
    networks:
      - myems-net

  telegraf:
    image: telegraf:latest
    container_name: myems-telegraf
    restart: always
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
    depends_on:
      - influxdb
      - broker
    networks:
      - myems-net

networks:
  myems-net:
    driver: bridge
    
volumes:
  mysql-data:
  influxdb-data: